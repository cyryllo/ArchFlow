appId: com.archflow.desktop
productName: ArchFlow
electronVersion: 32.3.3
npmRebuild: false
directories:
  output: dist
files:
  - src/**
  - resources/app-build/**
extraMetadata:
  main: src/main.js
mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.graphics-design
win:
  target: nsis
  icon: build/icon.png
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Graphics
  executableName: archflow
deb:
  packageName: archflow
  artifactName: "${productName}-${version}-${arch}.${ext}"
