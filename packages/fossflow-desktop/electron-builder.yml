appId: com.archflow.desktop
productName: ArchFlow
electronVersion: 32.3.3
npmRebuild: false
directories:
  output: dist
files:
  - src/**
  - resources/app-build/**
extraMetadata:
  main: src/main.js
mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.graphics-design
win:
  target: nsis
  icon: build/icon.png
nsis:
  # Classic installer: lets the user pick the folder, adds shortcuts
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ArchFlow
  artifactName: "${productName}-Setup-${version}.${ext}"
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Graphics
  executableName: archflow
appImage:
  artifactName: "${productName}-${version}-x86_64.${ext}"
deb:
  packageName: archflow
  artifactName: "${productName}-${version}-${arch}.${ext}"
