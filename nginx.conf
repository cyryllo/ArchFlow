# Scheme for links built by the MCP server: from an outer proxy if there is one
map $http_x_forwarded_proto $archflow_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    
    # Allow larger request bodies (up to 10MB)
    client_max_body_size 10M;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow larger bodies for API requests
        client_max_body_size 10M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # MCP server for AI assistants (runs only when MCP_TOKEN is set)
    location = /mcp {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $archflow_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 10M;
        proxy_read_timeout 300s;
        error_page 502 503 504 = @mcp_off;
    }

    location @mcp_off {
        default_type application/json;
        return 503 '{"jsonrpc":"2.0","error":{"code":-32000,"message":"The ArchFlow MCP server is off. Set MCP_TOKEN for the container to turn it on."},"id":null}';
    }
}
