services:
  fossflow:
    image: ghcr.io/cyryllo/archflow:${ARCHFLOW_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "9500:80"
    environment:
      - NODE_ENV=production
      - ENABLE_SERVER_STORAGE=${ENABLE_SERVER_STORAGE:-true}
      - STORAGE_PATH=/data/diagrams
      - ENABLE_GIT_BACKUP=${ENABLE_GIT_BACKUP:-false}
      # Turns on the MCP server for AI assistants at /mcp (see docs/mcp.md)
      - MCP_TOKEN=${MCP_TOKEN:-}
      # Logins: local = accounts (the first visit creates the administrator),
      # none = no logins, everyone can do everything (trusted networks only)
      - AUTH_MODE=${AUTH_MODE:-local}
      # Optional: create the administrator without the setup screen
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./diagrams:/data/diagrams
