name: Desktop builds

# Builds the desktop app (Electron, packages/fossflow-desktop):
#   - Linux: AppImage + .deb (ubuntu runner)
#   - Windows: NSIS installer .exe (windows runner - building it on Linux
#     would need wine)
# On a version tag the files are attached to that tag's GitHub release.
# "Run workflow" (manual) builds them as downloadable workflow artifacts;
# run it on a tag to (re)create that tag's release files.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            builder-args: --linux AppImage deb
          - os: windows-latest
            target: windows
            builder-args: --win nsis
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Build web app
        run: npm run build:app

      - name: Package desktop app
        working-directory: packages/fossflow-desktop
        run: npm run stage && npx electron-builder ${{ matrix.builder-args }} --x64 --publish never
        env:
          # No code-signing certificate: build unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: archflow-${{ matrix.target }}
          path: |
            packages/fossflow-desktop/dist/*.AppImage
            packages/fossflow-desktop/dist/*.deb
            packages/fossflow-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
